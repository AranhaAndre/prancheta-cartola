server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # health check do Northflank
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # página e dados mudam a cada build: o navegador sempre revalida
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
